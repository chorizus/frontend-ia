<section class="keyword-cloud">
    <h2 class="cloud-title">Palabras Clave</h2>
    <div class="cloud-container">
        <div class="word-cloud-wrapper">
            <span *ngFor="let word of wordCloudItems" class="cloud-word" [style.font-size.px]="word.size" [style.color]="word.color" [style.font-family]="word.fontFamily" [style.font-weight]="'600'" [title]="word.text + ' (' + word.weight + ' menciones)'">
                {{ word.text }}
            </span>
        </div>
    </div>
</section>
