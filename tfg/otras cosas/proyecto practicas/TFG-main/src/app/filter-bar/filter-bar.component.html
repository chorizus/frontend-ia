<div class="filter-bar">
    <div class="filter-group">
        <div *ngFor="let filter of filters" class="filter-dropdown">
            <button class="filter-button" (click)="toggleDropdown(filter.id)">
                {{ filter.label }}
                <img
                    src="https://cdn.builder.io/api/v1/image/assets/be32a78ac3ad4c2b893f916c2625ad63/243170c288a12fbde5fd9b722dc2ed7bae0146fd?placeholderIfAbsent=true"
                    alt="Expand"
                    class="expand-icon"
                    [class.rotated]="isDropdownOpen(filter.id)"
                />
            </button>

            <div *ngIf="isDropdownOpen(filter.id)" class="dropdown-menu">
                <div *ngFor="let option of filter.options" class="dropdown-item" [class.selected]="option.value === filter.selected" (click)="selectOption(filter.id, option)">
                    {{ option.label }}
                </div>
            </div>
        </div>

        <div class="filter-dropdown location-search-dropdown">
            <input type="text" placeholder="Buscar ubicación..." class="location-input" [(ngModel)]="locationSearch" (input)="onLocationInput($event)" (focus)="onLocationInput($event)" autocomplete="off" />
            <button *ngIf="locationSearch" class="clear-location-btn" (click)="clearLocation()">&times;</button>
            <div *ngIf="showLocationDropdown" class="location-dropdown-menu">
                <div *ngFor="let loc of filteredLocations" class="location-dropdown-item" (click)="selectLocation(loc)">
                    {{ loc }}
                </div>
            </div>
        </div>
    </div>

    <button class="more-filters-button" (click)="openFilterPanel()">
        <img
            src="https://cdn.builder.io/api/v1/image/assets/be32a78ac3ad4c2b893f916c2625ad63/3e728467d118ddd9af6c1ab7044ab3049054012b?placeholderIfAbsent=true"
            alt="Más filtros"
            class="more-filters-icon"
        />
    </button>
</div>

<!-- Overlay para cerrar dropdowns al hacer click fuera -->
<div *ngIf="openDropdown" class="dropdown-overlay" (click)="closeDropdown()"></div>

<!-- Panel de filtros -->
<app-filter-panel [isOpen]="isFilterPanelOpen" (closePanel)="closeFilterPanel()">
</app-filter-panel>
