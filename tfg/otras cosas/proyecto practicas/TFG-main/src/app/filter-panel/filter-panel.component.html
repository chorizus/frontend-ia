<!-- Overlay -->
<div *ngIf="isOpen" class="panel-overlay" (click)="close()"></div>

<!-- Panel lateral -->
<div class="filter-panel" [class.open]="isOpen">
    <!-- Header -->
    <div class="panel-header">
        <h2 class="panel-title">Filtros</h2>
        <button class="close-button" (click)="close()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    </div>

    <!-- Content -->
    <div class="panel-content">
        <!-- Periodo -->
        <div class="filter-section">
            <h3 class="section-title">Periodo</h3>

            <div class="filter-group">
                <label class="filter-label">Mes</label>
                <div class="dropdown-container">
                    <button class="dropdown-button" (click)="toggleDropdown('period')">
            {{ periodFilter.month }}
            <svg class="dropdown-icon" [class.rotated]="isDropdownOpen('period')" width="16" height="16" viewBox="0 0 16 16">
              <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </button>

                    <div *ngIf="isDropdownOpen('period')" class="dropdown-menu">
                        <div *ngFor="let month of periodFilter.options" class="dropdown-item" [class.selected]="month === periodFilter.month" (click)="selectPeriod(month)">
                            {{ month }}
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ubicaciones -->
        <div class="filter-section">
            <h3 class="section-title">Ubicaciones</h3>

            <!-- País -->
            <div class="filter-group">
                <label class="filter-label">País</label>
                <div class="dropdown-container">
                    <button class="dropdown-button" (click)="toggleDropdown('country')">
            {{ locationFilters.country.selected }}
            <svg class="dropdown-icon" [class.rotated]="isDropdownOpen('country')" width="16" height="16" viewBox="0 0 16 16">
              <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </button>

                    <div *ngIf="isDropdownOpen('country')" class="dropdown-menu">
                        <div *ngFor="let country of locationFilters.country.options" class="dropdown-item" [class.selected]="country === locationFilters.country.selected" (click)="selectCountry(country)">
                            {{ country }}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Región -->
            <div class="filter-group">
                <label class="filter-label">Región</label>
                <div class="dropdown-container">
                    <button class="dropdown-button" (click)="toggleDropdown('region')">
            {{ locationFilters.region.selected }}
            <svg class="dropdown-icon" [class.rotated]="isDropdownOpen('region')" width="16" height="16" viewBox="0 0 16 16">
              <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </button>

                    <div *ngIf="isDropdownOpen('region')" class="dropdown-menu">
                        <div *ngFor="let region of locationFilters.region.options" class="dropdown-item" [class.selected]="region === locationFilters.region.selected" (click)="selectRegion(region)">
                            {{ region }}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tiendas seleccionadas -->
            <div class="filter-group">
                <label class="filter-label">Tiendas seleccionadas</label>
                <div class="selected-stores">
                    <div *ngFor="let store of selectedStores" class="store-tag">
                        <span>{{ store }}</span>
                        <button class="remove-store" (click)="removeStore(store)">
              <svg width="16" height="16" viewBox="0 0 16 16">
                <path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
                    </div>
                </div>
            </div>

            <!-- Añadir tienda -->
            <div class="filter-group">
                <label class="filter-label">Añadir tienda</label>
                <div class="dropdown-container">
                    <button class="dropdown-button" (click)="toggleDropdown('addStore')">
            {{ storeToAdd || 'Seleccionar tienda' }}
            <svg class="dropdown-icon" [class.rotated]="isDropdownOpen('addStore')" width="16" height="16" viewBox="0 0 16 16">
              <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </button>

                    <div *ngIf="isDropdownOpen('addStore')" class="dropdown-menu">
                        <div *ngFor="let store of availableStores" class="dropdown-item" [class.disabled]="selectedStores.includes(store)" (click)="!selectedStores.includes(store) && selectStoreToAdd(store)">
                            {{ store }}
                            <span *ngIf="selectedStores.includes(store)" class="already-selected">(Ya seleccionada)</span>
                        </div>
                    </div>
                </div>
                <button class="add-store-btn" [disabled]="!storeToAdd || selectedStores.includes(storeToAdd)" (click)="addStore()">Añadir</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="panel-footer">
        <button class="apply-button" (click)="applyFilters()">
      Aplicar
    </button>
    </div>
</div>
